@principia_numerics_blueprint:HAS[@Sol_Configuration:HAS[#SystemScale[Stock]]]:AFTER[SolSystem]
{
  // Stock scale is 1/9 in length and 1/3 in orbital time.  Keep the
  // numerical tolerances and integration steps in the same proportions as
  // the Real and Quarter blueprints.
  @downsampling
  {
    @tolerance = 1.111111111111111 m
  }
  @ephemeris
  {
    @integration_step_size = 3.333333333333333 min
    @fitting_tolerance = 0.111111111111111 mm
  }
  @history
  {
    @integration_step_size = 3.333333333333333 s
  }
  @psychohistory
  {
    @length_integration_tolerance = 0.111111111111111 mm
    @speed_integration_tolerance = 0.333333333333333 mm/s
  }
}
