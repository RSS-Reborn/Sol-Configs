// ============================================================================
// Radiation environments for Sol bodies
// ============================================================================

+RadiationBody[Moho]:NEEDS[SolSystem]   { @name = Mercury }
+RadiationBody[Eve]:NEEDS[SolSystem]    { @name = Venus }
+RadiationBody[Kerbin]:NEEDS[SolSystem] { @name = Earth }
+RadiationBody[Duna]:NEEDS[SolSystem]   { @name = Mars }
+RadiationBody[Jool]:NEEDS[SolSystem]   { @name = Jupiter }

RadiationModel
{
    name = Saturn

    has_inner = true
    inner_dist = 2.2
    inner_radius = 1.4
    inner_compression = 1.02
    inner_extension = 0.98
    inner_border_start = 0.1
    inner_border_end = 1.0
    inner_quality = 40.0

    has_outer = true
    outer_dist = 7
    outer_radius = 7
    outer_compression = 1.05
    outer_extension = 0.95
    outer_border_start = 0.1
    outer_border_end = 1.0
    outer_quality = 30.0

    has_pause = true
    pause_radius = 20
    pause_compression = 1.02
    pause_extension = 0.1
    pause_height_scale = 1
    pause_quality = 20.0
}

// Old Saturn radiation value moved to new inner belt.
// New saner radiation value for the outer belt, Saturn is NOT supposed to be nearly as deadly as it currently is.
RadiationBody
{
    name = Saturn
    radiation_model = Saturn
    radiation_inner = 150
    radiation_outer = 5
    radiation_pause = -0.011
    geomagnetic_offset = 0.04
}

// Uranus and Neptune previously recycled Saturn's model, this splits them so Saturn can do its own stuff.

RadiationModel
{
    name = Outer

    has_inner = false

    has_outer = true
    outer_dist = 7
    outer_radius = 7
    outer_compression = 1.05
    outer_extension = 0.95
    outer_border_start = 0.1
    outer_border_end = 1.0
    outer_quality = 30.0

    has_pause = true
    pause_radius = 20
    pause_compression = 1.02
    pause_extension = 0.1
    pause_height_scale = 1
    pause_quality = 20.0
}

// The Uranian magnetic field is approximately 50 times more powerful that the Earth's,
// and is unusual in many ways. Most obviously, the magnetic field axis is tilted at an
// angle of 58.6° to the planet's rotational axis, and offset by a distance of about
// 8000 km (0.3 Uranus Radii (RU)) from the centre of the planet
RadiationBody
{
    name = Uranus
    radiation_model = Outer
    radiation_inner = 75
    radiation_outer = 4
    radiation_pause = -0.01
    geomagnetic_pole_lat = 31.4
    geomagnetic_offset = 0.3
}

// Neptune's magnetic field is about half as powerful as Uranus', making it
// approximately 25 times as strong as the Earth's. However, the magnetic axis
// is tilted at an angle of 47° to the rotational axis, and it is offset by a
// huge distance of about 13600 km (0.55 RN)!!
RadiationBody
{
    name = Neptune
    radiation_model = Outer
    radiation_inner = 39
    radiation_outer = 2.5
    radiation_pause = -0.007
    geomagnetic_pole_lat = 43
    geomagnetic_offset = 0.55
}

RadiationBody
{
    name = Titan
    radiation_model = ionosphere
    radiation_pause = -0.004
    reference = 14
}

// Jupiter definitely needs a dedicated config making at some point, but for now here's Ganymede

RadiationModel
{
  name = JupiterGanymede

  has_outer = true
  outer_dist = 0.8
  outer_radius = 0.7
  outer_deform_xy = 0.5
  outer_border_dist = 0.03
  outer_border_radius = 0.8
  outer_border_deform_xy = 0.5
  outer_quality = 30.0

  has_pause = true
  pause_radius = 5
  pause_height_scale = 1.1
  pause_deform = 0.04
  pause_quality = 20.0
}

RadiationBody
{
    name = Ganymede
    radiation_model = JupiterGanymede
    radiation_outer = 0.5
    radiation_pause = -0.005
    geomagnetic_pole_lat = -86
    geomagnetic_pole_lon = 90
}


// ============================================================================
// Tweak heliopause
// ============================================================================

@RadiationModel[heliopause]
{
    @pause_radius = 16000.0
    @pause_quality = 0.01
}
