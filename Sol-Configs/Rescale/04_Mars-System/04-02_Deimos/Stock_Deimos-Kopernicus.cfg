@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Stock]]]:AFTER[SolSystem]
{
    @Body[Deimos]
    {
        @Orbit
        {
            @semiMajorAxis /= 9
        }
        @Properties
        {
            @radius /= 9
            @gravParameter /= 81
            @rotationPeriod /= 3
            @timewarpAltitudeLimits[*, ] /= 3
            %maxZoom = 1000
            @ScienceValues
            {
                @flyingAltitudeThreshold /= 3
                @spaceAltitudeThreshold /= 3
            }
        }
        @ScaledVersion
        {
            @fadeStart /= 9
            @fadeEnd /= 9
            @Material
            {
                @_HeightScale /= 4
                @_HeightOffset /= 4
            }

        }
        @PQS
        {
            @maxLevel -= 3
            @fadeStart /= 9
            @fadeEnd /= 9
            @deactivateAltitude /= 9
            @Material
            {
                @_HeightScale /= 9
                @_HeightOffset /= 9
                @_NearFieldEnd /= 9
                @_BlendWidth /= 9
                @_TileDisplacementRange /= 9

                @_NormalFadeStart /= 3
                @_NormalFadeEnd /= 3
            }
            @Mods
            {
                @MirageTerrain
                {
                    @deformity /= 9
                    @offset /= 9
                }
            }
        }
    }
}
