@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[SolSystem]
{
    @Body[Amalthea]
    {
        @Orbit
        {
            @semiMajorAxis /= 4
        }
        @Properties
        {
            @radius /= 4
            @gravParameter /= 16
            @rotationPeriod /= 2
            @timewarpAltitudeLimits[*, ] /= 2
            @ScienceValues
            {
                @flyingAltitudeThreshold /= 2
                @spaceAltitudeThreshold /= 2
            }
        }
        @ScaledVersion
        {
            @fadeStart /= 2
            @fadeEnd /= 2
            @Material
            {
                @_HeightScale /= 4
                @_HeightOffset /= 4
            }
        }
        @PQS
        {
            @maxLevel -= 1
            @fadeStart /= 2
            @fadeEnd /= 2
            @deactivateAltitude /= 2
            @Material
            {
                @_HeightScale /= 4
                @_HeightOffset /= 4
                @_NearFieldEnd /= 4
                @_BlendWidth /= 4
                @_TileDisplacementRange /= 4

                @_NormalFadeStart /= 2
                @_NormalFadeEnd /= 2
            }
            @Mods
            {
                @MirageTerrain
                {
                    @deformity /= 4
                    @offset /= 4
                }
            }
        }
    }
}
