@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[z_SolSystem]
{
    @Body,*
    {
        @PQS
        {
            @Mods
            {
                @BoundedDecalBicubic,*
                {
                    @deformity /= 4
                    @offset /= 4
                }
                @BoundedDecal,*
                {
                    @deformity /= 4
                    @offset /= 4
                }
            }
            @MapDecalVertexRemoveScatter,*
            {
                @radius /= 4
            }
        }
    }
    @Body[Earth]
    {
        @PQS
        {
            @Mods
            {
                @MapDecalVertexRemoveScatter[MahiaMask]
                {
                    @Position
                    {
                        @latitude += 0.3
                        @longitude -= 0.05
                    }
                }
                @GuamMaskMapDecalVertexRemoveScatter[GuamMask]
                {
                    @Position
                    {
                        @latitude = 13.449347
                        @longitude = 144.760729
                    }
                    @radius = 700
                }
            }
        }
    }
}