// Borrowed from Realism Overhaul.
@PHYSICSGLOBALS:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FIRST
{
    // AeroFX
    @aeroFXStartThermalFX = 4.5
    @aeroFXFullThermalFX = 6.5
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[SolSystem]
{
    @Body,*
    {
        @Properties
        {
            @inverseRotThresholdAltitude /= 2
        }
    }
}