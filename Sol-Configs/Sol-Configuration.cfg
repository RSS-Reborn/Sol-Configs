Sol_Configuration
{

    //////////////////////////////////// GENERAL USER SETTINGS ////////////////////////////////////


    //System Scale
    SystemScale = Real // Real, Quarter, Stock
    //Real - All celestial bodies are realistically sized.
    //Quarter - All planets and bodies are quarter sized, this functions similarly to KSRSS.
    //Stock - All planets are 1/9th scale, this preserves rotations while functioning similarly stock.

    IconDisplayMode = OBJ // ALL, OBJ_PE_AP, OBJ, NONE
    // These settings apply to all objects in Sol.
    // ALL - Shows the icon, the ascending and descending nodes, and the apoapsis and periapsis of the body.
    // OBJ_PE_AP - Shows the icon, and the apoasis and periapsis of the body.
    // OBJ - Shows only the icon of the body.
    // None - Disables the icon the body.

    AsteroidOrbitDisplayMode = ALL // ALL, MAJOR, MBA, NEO, NONE
    // ALL - Shows all asteroids in Sol
    // MAJOR - All asteroids featured in either KSRSS or RSS. Shows the following asteroids: Ceres, Vesta, Eros, Ryugu
    // MBA - Main belt asteroids. Shows the following asteroids: Ceres, Pallas, Vesta, Psyche, Ida
    // NEO - Near earth objects. Shows the following asteroids: Eros, Ryugu
    // Warning: This does not disable contracts to these bodies, merely hides them to avoid cluttering the map view.


    ///////////////////////////////////////////////////////////////////////////////////////////////
}














































